services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timelogic
      POSTGRES_USER: timelogic
      POSTGRES_PASSWORD: timelogic
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timelogic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timelogic -d timelogic"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - timelogic-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  timelogic-postgres:
  timelogic-redis:
