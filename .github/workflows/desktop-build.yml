name: Build Desktop Installers

# Builds the TimeLogic Admin desktop app for Windows and Linux on native
# runners. Trigger it from the Actions tab
# ("Run workflow"), then download the installers from the run's Artifacts.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            script: dist:linux
          - os: windows-latest
            artifact: windows
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        env:
          # Production build; the packaged app talks to the deployed backend.
          VITE_API_URL: https://timelogic.onrender.com/api
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ${{ matrix.script }}

      - name: Validate Linux package dependencies
        if: matrix.artifact == 'linux'
        run: |
          dpkg-deb --info desktop/release/*.deb
          sudo apt-get install --simulate ./desktop/release/*.deb

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: timelogic-admin-${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.deb
          if-no-files-found: error
