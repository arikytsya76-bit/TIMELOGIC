services:
  - type: web
    name: timelogic-backend
    runtime: node
    rootDir: backend
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_DIR
        value: /data/uploads
    disk:
      name: timelogic-uploads
      mountPath: /data
      sizeGB: 1
